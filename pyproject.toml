[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-shark-app"
version = "0.8.0"
description = "Local-first passive vehicle intelligence, evidence, learning and shadow-autonomy platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "cryptography==45.0.6",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1"]

[project.scripts]
vision-shark = "vision_shark.main:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vision_shark*"]

[tool.setuptools.package-data]
vision_shark = ["web/*"]
