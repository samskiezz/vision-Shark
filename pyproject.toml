[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-shark-app"
version = "0.9.0"
description = "Vehicle intelligence, evidence, diagnostics, learning, shadow-autonomy and offline calibration workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.1,<1",
  "uvicorn>=0.41,<1",
  "pydantic>=2.12.5,<3",
  "cryptography>=50.0.0,<51",
  "argon2-cffi>=25.1.0,<26",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.28.1,<1"]
analytics = ["pyarrow>=18,<24"]
database = ["canmatrix[arxml,fibex,kcd,sym]>=1.2,<2"]
measurement = ["asammdf>=8.7,<9"]
learning = [
  "torch>=2.4,<3",
  "onnx>=1.16,<2",
  "onnxruntime>=1.19,<2",
]

[project.scripts]
vision-shark = "vision_shark.main:cli"
vision-shark-tune = "vision_shark.tuning_cli:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vision_shark*"]

[tool.setuptools.package-data]
vision_shark = ["web/*"]
