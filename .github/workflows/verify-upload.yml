name: Verify Vision Shark source upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-upload.yml'
      - 'vision_shark/**'
      - 'tests/**'
      - 'scripts/**'
      - 'PRODUCT_STATUS.json'
      - 'MANIFEST.sha256'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require real source tree
        run: |
          set -euo pipefail
          test -f vision_shark/runtime.py
          test -f vision_shark/transports.py
          test -f vision_shark/dbc.py
          test -f vision_shark/replay.py
          test -f vision_shark/diagnostics.py
          test -f PRODUCT_STATUS.json
          test -f MANIFEST.sha256
      - name: Verify product-status truthfulness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('PRODUCT_STATUS.json').read_text())
          assert status.get('original_product_complete') is False
          assert status.get('production_release') is False
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify manifest
        run: python scripts/verify_manifest.py
      - name: Run automated tests
        run: python -m pytest -q
      - name: Mark verified upload
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('SOURCE_UPLOAD_VERIFIED.txt').write_text(
              'GitHub-side verification passed: required source tree, manifest, product-status guard, dependency install, and pytest.\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_UPLOAD_VERIFIED.txt
          git diff --cached --quiet || git commit -m 'Mark verified Vision Shark source upload'
          git push
