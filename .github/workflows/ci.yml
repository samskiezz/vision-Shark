name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,analytics,database,measurement]' 'pip-audit>=2.10.1,<3' cantools ruff
      - name: Dependency resolution check
        run: python -m pip check
      - name: Python correctness/static checks
        run: ruff check vision_shark tests --select F,B,RUF012
      - run: python -m pytest -q
      - run: python -m compileall -q vision_shark
      - name: JavaScript syntax checks
        run: |
          for file in vision_shark/web/*.js; do
            node --check "$file"
          done
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Generate CycloneDX SBOM
        run: pip-audit --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vision-shark-sbom
          path: sbom.cdx.json
      - name: Reject unresolved implementation markers
        run: |
          if grep -RInE 'TODO|FIXME|NotImplementedError|IMPLEMENT[ _-]?ME|stub implementation|placeholder implementation|implementation placeholder' vision_shark tests --exclude-dir='__pycache__'; then
            echo 'Unresolved implementation marker found'; exit 1
          fi
      - name: Verify release metadata
        run: |
          python - <<'PY'
          import pathlib, tomllib
          from vision_shark import __version__
          p=tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert p['project']['version']==__version__=='0.9.0'
          PY

  learning-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
      - name: Install learning runtime
        run: python -m pip install -e '.[dev]' 'onnx>=1.16,<2' 'onnxscript>=0.5,<1' 'onnxruntime>=1.19,<2' 'pillow>=10,<13'
      - name: Learning dependency resolution check
        run: python -m pip check
      - name: Spatial BEV forward/backward and ONNX smoke
        run: python -m pytest -q tests/test_spatial_bev_world_model.py tests/test_camera_geometry_learning.py
