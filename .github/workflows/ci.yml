name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  production-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q vision_shark
      - run: node --check vision_shark/web/app.js
      - name: Reject unresolved implementation markers
        run: |
          if grep -RInE 'TODO|FIXME|NotImplementedError|placeholder' vision_shark tests --exclude-dir='__pycache__'; then
            echo 'Unresolved implementation marker found'; exit 1
          fi
      - name: Verify release metadata
        run: |
          python - <<'PY'
          import pathlib, tomllib
          from vision_shark import __version__
          p=tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert p['project']['version']==__version__=='0.8.0'
          PY
