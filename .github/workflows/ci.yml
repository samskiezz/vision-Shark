name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  production-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,analytics,database,measurement]' pip-audit cyclonedx-bom cantools ruff
      - name: Dependency resolution check
        run: python -m pip check
      - name: Python correctness/static checks
        run: ruff check vision_shark tests --select F,B,RUF012
      - run: python -m pytest -q
      - run: python -m compileall -q vision_shark
      - run: node --check vision_shark/web/app.js
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vision-shark-sbom
          path: sbom.cdx.json
      - name: Reject unresolved implementation markers
        run: |
          if grep -RInE 'TODO|FIXME|NotImplementedError|placeholder' vision_shark tests --exclude-dir='__pycache__'; then
            echo 'Unresolved implementation marker found'; exit 1
          fi
      - name: Verify release metadata
        run: |
          python - <<'PY'
          import pathlib, tomllib
          from vision_shark import __version__
          p=tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert p['project']['version']==__version__=='0.9.0'
          PY
