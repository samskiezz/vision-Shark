name: Import approved source snapshot
on:
  push:
    branches: [main]
    paths: ['.source-transfer/ready.json']
permissions:
  contents: write
concurrency:
  group: vision-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Verify and import the owner-approved development snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .source-transfer/ready.json ]; then
            echo 'No pending source transfer.'
            exit 0
          fi
          python3 .source-transfer/import.py
          git config user.name 'Vision Shark source import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github'
          if git diff --cached --quiet; then
            echo 'Source already matches.'
            exit 0
          fi
          git commit -m 'Import complete integration-repair source, tests and documentation'
          git push origin HEAD:main
