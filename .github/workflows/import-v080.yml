name: Import Vision Shark 0.8.0 full source
on:
  push:
    branches: [main]
    paths: ['.source-transfer/v080.ready']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct and verify full source
        shell: bash
        run: |
          set -euo pipefail
          cat .source-transfer/v080.part.* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          mkdir /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          test -f /tmp/source/vision_shark/runtime.py
          test -f /tmp/source/vision_shark/autonomy/runtime.py
          test -f /tmp/source/vision_shark/orchestrator.py
          test -f /tmp/source/MANIFEST.sha256
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .source-transfer -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -rf .source-transfer
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python scripts/verify_manifest.py
          python -m pytest -q
          python -m compileall -q vision_shark
          node --check vision_shark/web/app.js
      - name: Commit verified reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Vision Shark 0.8.0 full integrated platform'
          git push origin HEAD:main
